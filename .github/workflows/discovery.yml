name: Discover unverified news candidates

on:
  schedule:
    # Offset from the top of the hour; runs on the default branch, UTC.
    - cron: '37 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdelt-discovery
  cancel-in-progress: false

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Collect candidates without updating public events
        run: python scripts/discover_gdelt.py
      - name: Upload reviewer artifact (never a Pages artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unverified-news-candidates-${{ github.run_id }}
          path: data/candidates/latest.json
          if-no-files-found: error
          retention-days: 14
