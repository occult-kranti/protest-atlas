<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protest Atlas — layout check</title><style>body{margin:0;background:#dfe3da;color:#202a28;font:14px Arial}header{padding:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}select{font:16px Arial;padding:7px}main{overflow:auto;padding:10px}iframe{height:1050px;border:1px solid #657361;background:white;display:block}a{color:inherit}</style></head><body><header><strong>Responsive layout check</strong><label>Viewport <select id="size"><option>320</option><option selected>390</option><option>768</option><option>1440</option></select></label><label>Page <select id="page"><option value="index.html">World map</option><option value="review.html">Review desk</option></select></label><a href="./">Open site</a><span>Same-origin frame; width is a real CSS viewport. Touch and screen-reader behavior require separate checks.</span></header><main><iframe id="preview" title="Protest Atlas responsive preview" width="390" src="index.html"></iframe></main><script>const frame=document.getElementById('preview');document.getElementById('size').addEventListener('change',e=>frame.width=e.target.value);document.getElementById('page').addEventListener('change',e=>frame.src=e.target.value);</script></body></html>
