<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Protest Atlas — layout check</title>
  <style>
    body { margin: 0; background: #dfe3da; color: #1a1c19; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 12px 16px; border-bottom: 1px solid #7a7d74; }
    label { display: inline-flex; align-items: center; gap: 6px; }
    select { min-height: 44px; padding: 0 8px; font: 16px Arial, sans-serif; }
    a { color: inherit; }
    a, select { min-height: 44px; }
    header a { display: inline-flex; align-items: center; }
    main { overflow: auto; padding: 12px 16px; }
    iframe { display: block; border: 1px solid #7a7d74; background: #fffdf8; }
    p { margin: 0; max-width: 60ch; }
  </style>
</head>
<body>
  <header>
    <strong>Responsive layout check</strong>
    <label>Viewport <select id="size">
      <option value="320x640">320 × 640</option>
      <option value="360x780">360 × 780</option>
      <option value="390x844" selected>390 × 844</option>
      <option value="768x1024">768 × 1024</option>
      <option value="1024x768">1024 × 768</option>
      <option value="1440x900">1440 × 900</option>
      <option value="640x410">640 × 410 (landscape)</option>
      <option value="844x390">844 × 390 (landscape)</option>
      <option value="720x450">720 × 450 (200 % zoom)</option>
      <option value="320x256">320 × 256 (400 % zoom)</option>
    </select></label>
    <label>Page <select id="page">
      <option value="index.html#/latest">Reports (index.html#/latest)</option>
      <option value="index.html#/map">Map (index.html#/map)</option>
      <option value="index.html#/ahead">Ahead (index.html#/ahead)</option>
      <option value="index.html#/ahead/roadmap">Coming next (index.html#/ahead/roadmap)</option>
      <option value="index.html#/countries">Countries (index.html#/countries)</option>
      <option value="index.html#/about">About (index.html#/about)</option>
      <option value="review.html">Editor desk (review.html)</option>
      <option value="404.html">Not found (404.html)</option>
    </select></label>
    <a id="open" href="./">Open page</a>
    <p>Same-origin frame; the width is a real CSS viewport. Touch, zoom and screen-reader behaviour need separate checks.</p>
  </header>
  <main><iframe id="preview" title="Protest Atlas responsive preview" width="390" height="844" src="index.html"></iframe></main>
  <script>
    // Published as /checks.html next to index.html; when opened from tests/ in the repository, pages live one level up.
    const base = /\/tests\/[^/]*$/.test(location.pathname) ? '../' : './';
    const frame = document.getElementById('preview');
    const size = document.getElementById('size');
    const page = document.getElementById('page');
    const open = document.getElementById('open');
    function apply() {
      const [w, h] = size.value.split('x').map(Number);
      frame.width = String(w);
      frame.height = String(h);
      frame.src = base + page.value;
      open.href = base + page.value;
    }
    size.addEventListener('change', apply);
    page.addEventListener('change', apply);
    apply();
  </script>
</body>
</html>
